<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Hexagon (pointy top & bottom) -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    stroke="url(#g)"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!--
    Arrow direction: 45° upper-right
    Arrow tip: (79, 24)
    Back-center (14 units back from tip at 225°): (79-9.9, 24+9.9) = (69, 34)
    Wing 1 (+perp 11 units, 135°): (69+7.8, 34+7.8) = (77, 42)
    Wing 2 (-perp 11 units, 315°): (69-7.8, 34-7.8) = (61, 26)
  -->

  <!-- Zigzag trend line — ends exactly at arrowhead base center (69,34) -->
  <polyline
    points="18,70 30,47 42,63 55,39 69,34"
    stroke="url(#g)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead filled triangle (tip=79,24 | wing1=77,42 | wing2=61,26) -->
  <polygon
    points="79,24 77,42 61,26"
    fill="url(#g)"
  />
</svg>
